<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1600pls — Free SAT Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
  :root{
    --paper: #F5F3EC;
    --paper-raised: #FFFFFF;
    --ink: #1C2B4A;
    --ink-deep: #101A30;
    --gold: #B9852E;
    --gold-soft: #E9D9B8;
    --correct: #2E7D53;
    --correct-bg: #E4F1E9;
    --incorrect: #B23A3A;
    --incorrect-bg: #F6E6E4;
    --line: #E4E0D3;
    --muted: #6B7280;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --serif: 'Source Serif 4', serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: radial-gradient(circle at 88% -8%, rgba(185,133,46,0.09), transparent 42%), var(--paper);
    color: var(--ink-deep);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .app{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---------- Masthead ---------- */
  header.masthead{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding-bottom: 16px; margin-bottom: 6px; flex-wrap: wrap; gap: 14px;
  }
  .wordmark{
    font-family: var(--serif); font-weight: 700; font-size: 32px;
    letter-spacing: -0.01em; color: var(--ink-deep);
    display:flex; align-items:baseline; gap: 2px; cursor:pointer;
    border-bottom: 4px solid var(--gold); padding-bottom: 2px; width: fit-content;
  }
  .wordmark .free{ color: var(--ink-deep); font-weight: 700; }
  .wordmark .sat{ color: var(--ink-deep); font-weight: 700; }
  .tagline{ font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .masthead-sub{ font-family: var(--mono); font-size: 12px; color: var(--muted); text-align:right; }

  /* ---------- Primary nav ---------- */
  .nav-tabs{ display:flex; gap: 4px; margin: 0 0 26px; border-bottom: 1px solid var(--line); }
  .nav-tab{
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 12px 18px 10px; cursor: pointer; color: var(--muted);
    border-bottom: 3px solid transparent; display:flex; align-items:center; gap:8px;
    transition: color .12s ease, border-color .12s ease;
    background:none; border-top:none; border-left:none; border-right:none;
  }
  .nav-tab:hover{ color: var(--ink-deep); }
  .nav-tab.active{ color: var(--ink-deep); border-bottom-color: var(--gold); font-weight:600; }
  .soon-badge{
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; color: var(--gold);
    border: 1px solid var(--gold); padding: 2px 6px; border-radius: 20px; text-transform: uppercase;
  }

  /* ---------- Generic panel ---------- */
  .panel{ background: var(--paper-raised); border: 1px solid var(--line); }
  .panel-title{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); font-weight: 600; margin: 0 0 14px; display:flex; align-items:center; gap:8px;
  }
  .panel-title::before{ content:""; width:6px; height:6px; background: var(--gold); display:inline-block; }
  .panel-sub{ font-size: 12.5px; color: var(--muted); margin: -8px 0 16px; line-height:1.5; }

  /* =========================================================
     HOME PAGE
     ========================================================= */
  .home-hero{ margin-bottom: 26px; }
  .home-hero .big{ font-family: var(--serif); font-weight:700; font-size: 28px; margin-bottom: 6px; }
  .home-hero p{ color: var(--muted); font-size: 14.5px; max-width: 560px; margin:0; }

  .stat-row{ display:grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 26px; }
  @media (max-width: 760px){ .stat-row{ grid-template-columns: repeat(2,1fr); } }
  .stat-card{ background: var(--paper-raised); border: 1px solid var(--line); padding: 16px 18px; }
  .stat-card .lbl{ font-family: var(--mono); font-size: 10px; text-transform:uppercase; letter-spacing:.07em; color: var(--muted); margin-bottom:8px; }
  .stat-card .val{ font-family: var(--serif); font-weight:700; font-size: 26px; color: var(--ink-deep); }
  .stat-card .sub{ font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 4px; }

  .home-grid{ display:grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items:start; margin-bottom: 22px; }
  @media (max-width: 900px){ .home-grid{ grid-template-columns: 1fr; } }

  .insights-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items:start; margin-bottom: 22px; }
  @media (max-width: 900px){ .insights-grid{ grid-template-columns: 1fr; } }

  .chart-panel{ padding: 20px 22px 18px; min-width: 0; }
  .chart-wrap{ width:100%; }
  .chart-wrap svg{ display:block; width:100%; height:auto; }

  .score-form{
    display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-family: var(--mono); font-size: 10px; text-transform:uppercase; letter-spacing:.06em; color: var(--muted); }
  .field input{
    font-family: var(--mono); font-size: 14px; padding: 9px 10px;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink-deep); width: 110px;
  }
  .field input:focus{ outline:none; border-color: var(--gold); }
  .field.wide input{ width: 140px; }
  .btn{
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 10px 16px; border: 1px solid var(--ink-deep); background: var(--paper-raised); color: var(--ink-deep);
    cursor: pointer; transition: all .12s ease; white-space:nowrap;
  }
  .btn:hover:not(:disabled){ background: var(--ink-deep); color: var(--paper-raised); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.primary{ background: var(--ink-deep); color: var(--paper-raised); }
  .btn.primary:hover:not(:disabled){ background: var(--ink); }
  .btn.gold{ border-color: var(--gold); color:var(--gold); }
  .btn.gold:hover:not(:disabled){ background:var(--gold); color:#fff; }
  .btn.ghost{ border-color: var(--line); color: var(--muted); }
  .btn.ghost:hover:not(:disabled){ background: var(--incorrect); border-color:var(--incorrect); color:#fff; }
  .btn.small{ padding:6px 10px; font-size:10.5px; }

  .score-table-wrap{ margin-top: 14px; max-height: 160px; overflow-y:auto; }
  .score-table{ width:100%; border-collapse:collapse; font-size: 12.5px; }
  .score-table th{
    font-family: var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em;
    color: var(--muted); text-align:left; padding: 6px 8px; border-bottom: 1px solid var(--line);
    position:sticky; top:0; background:var(--paper-raised);
  }
  .score-table td{ padding: 7px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
  .score-table .del{ cursor:pointer; color: var(--incorrect); font-weight:600; }
  .score-table-empty{ font-size:12.5px; color: var(--muted); padding: 10px 2px; }

  .rec-panel{ padding: 22px 22px 20px; }
  .rec-card{
    border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 12px; background: var(--paper);
  }
  .rec-card:last-child{ margin-bottom:0; }
  .rec-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .rec-skill{ font-family: var(--serif); font-weight:600; font-size: 15px; color: var(--ink-deep); line-height:1.3; }
  .rec-domain{ font-family: var(--mono); font-size: 9.5px; color: var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .rec-gain{ text-align:right; flex-shrink:0; }
  .rec-gain .num{ font-family: var(--serif); font-weight:700; font-size: 20px; color: var(--gold); }
  .rec-gain .lbl{ font-family: var(--mono); font-size: 8.5px; color: var(--muted); text-transform:uppercase; }
  .rec-meta{ display:flex; align-items:center; gap:10px; margin-bottom: 10px; }
  .rec-accuracy-bar{ flex:1; height:6px; background: var(--line); overflow:hidden; }
  .rec-accuracy-bar .fill{ height:100%; background: var(--gold); }
  .rec-accuracy-text{ font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space:nowrap; }
  .rec-disclaimer{ font-size: 11px; color: var(--muted); margin-top: 14px; line-height:1.5; border-top:1px solid var(--line); padding-top:12px; }

  .rec-empty{ text-align:center; padding: 30px 10px; color: var(--muted); font-size: 13px; }

  /* =========================================================
     MATH PAGE
     ========================================================= */
  .domain-tabs{ display:flex; flex-wrap:wrap; gap: 8px; margin-bottom: 22px; }
  .domain-tab{
    font-family: var(--mono); font-size: 12px; padding: 8px 14px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); cursor: pointer; display:flex; align-items:center; gap:8px;
    transition: all .12s ease;
  }
  .domain-tab:hover{ border-color: var(--ink); }
  .domain-tab.active{ background: var(--ink-deep); border-color: var(--ink-deep); color: var(--paper-raised); }
  .domain-tab .dcount{ font-size: 10px; padding: 1px 6px; border-radius: 20px; background: var(--gold-soft); color: var(--gold); }
  .domain-tab.active .dcount{ background: rgba(255,255,255,0.18); color: var(--paper-raised); }
  .domain-tab.empty .dcount{ background: var(--line); color: var(--muted); }
  .domain-tab.active.empty .dcount{ background: rgba(255,255,255,0.12); color: var(--paper-raised); }

  .layout{ display:grid; grid-template-columns: 250px 1fr; gap: 20px; align-items:start; }
  .layout.single-col{ grid-template-columns: 1fr; }
  @media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

  .sidebar .panel{ padding: 18px; margin-bottom: 16px; }

  .score-ring-wrap{ position:relative; width:96px; height:96px; margin: 4px auto 12px; }
  .score-ring-wrap svg{ transform: rotate(-90deg); }
  .score-ring-bg{ fill:none; stroke: var(--line); stroke-width: 8; }
  .score-ring-fg{ fill:none; stroke: var(--gold); stroke-width: 8; stroke-linecap: butt; transition: stroke-dashoffset .4s ease; }
  .score-ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring-label .num{ font-family: var(--serif); font-weight:700; font-size: 21px; color: var(--ink-deep); }
  .score-ring-label .lbl{ font-family: var(--mono); font-size: 8.5px; color: var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .score-stats{
    display:flex; justify-content:space-between; font-family: var(--mono); font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px;
  }
  .score-stats b{ color: var(--ink-deep); font-size: 12.5px; }

  .filter-divider{ border-top: 1px solid var(--line); margin: 16px 0; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family: var(--mono); font-size: 11px; padding: 6px 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); cursor: pointer; user-select:none; transition: all .12s ease;
  }
  .chip:hover{ border-color: var(--ink); }
  .chip.active{ background: var(--ink-deep); color: var(--paper-raised); border-color: var(--ink-deep); }
  .chip.diff-easy.active{ background: var(--correct); border-color:var(--correct); }
  .chip.diff-medium.active{ background: var(--gold); border-color:var(--gold); }
  .chip.diff-hard.active{ background: var(--incorrect); border-color:var(--incorrect); }

  .skill-list{ display:flex; flex-direction:column; gap:2px; margin-top:10px; }
  .skill-item{ display:flex; align-items:center; gap:9px; font-size: 12.5px; padding: 6px 4px; cursor:pointer; }
  .skill-item:hover{ background: var(--paper); }
  .skill-item.disabled{ cursor: default; opacity: 0.5; }
  .skill-item.disabled:hover{ background: none; }
  .skill-item input{ accent-color: var(--ink-deep); width:13px; height:13px; flex-shrink:0; }
  .skill-item .count{ margin-left:auto; font-family:var(--mono); font-size:10.5px; color: var(--muted); }

  .reset-btn{
    width:100%; margin-top: 14px; background: transparent; border: 1px solid var(--ink-deep); color: var(--ink-deep);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px; cursor: pointer;
  }
  .reset-btn:hover{ background: var(--ink-deep); color: var(--paper-raised); }

  .main .panel{ padding: 0; }
  .qcard{ padding: 26px 30px 28px; }
  @media (max-width: 560px){ .qcard{ padding: 20px 16px 24px; } }
  .qcard-topline{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; flex-wrap:wrap; gap:10px; }
  .qcard-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tag{
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 4px 9px; border: 1px solid var(--line); color: var(--ink); background: var(--paper);
  }
  .tag.difficulty-Easy{ border-color: var(--correct); color: var(--correct); }
  .tag.difficulty-Medium{ border-color: var(--gold); color: var(--gold); }
  .tag.difficulty-Hard{ border-color: var(--incorrect); color: var(--incorrect); }
  .qid{ font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .qposition{ font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  .qbody{ font-family: var(--serif); font-size: 18.5px; line-height: 1.55; color: var(--ink-deep); margin-bottom: 20px; }

  .qfigure{ display:flex; justify-content:center; margin: 8px 0 20px; padding: 14px; background: var(--paper); border: 1px solid var(--line); }
  .qfigure table{ border-collapse: collapse; font-family: var(--mono); font-size: 14px; }
  .qfigure td, .qfigure th{ border: 1px solid var(--ink); padding: 6px 14px; text-align:center; }
  .qfigure th{ background: var(--gold-soft); }

  .choices{ display:flex; flex-direction:column; gap:9px; margin-bottom: 20px; }
  .choice{ display:flex; align-items:center; gap:13px; padding: 12px 15px; border: 1px solid var(--line); background: var(--paper-raised); cursor:pointer; transition: border-color .12s ease, background .12s ease; }
  .choice:hover{ border-color: var(--ink); }
  .bubble{
    flex-shrink:0; width: 28px; height:28px; border-radius:50%; border: 2px solid var(--ink-deep);
    display:flex; align-items:center; justify-content:center; font-family: var(--mono); font-weight:600; font-size:12.5px;
    color: var(--ink-deep); background: var(--paper-raised); transition: all .12s ease;
  }
  .choice.selected .bubble{ background: var(--ink-deep); color: var(--paper-raised); }
  .choice-text{ font-size: 15.5px; color: var(--ink-deep); }
  .choice.correct{ border-color: var(--correct); background: var(--correct-bg); }
  .choice.correct .bubble{ background: var(--correct); border-color: var(--correct); color:#fff; }
  .choice.incorrect{ border-color: var(--incorrect); background: var(--incorrect-bg); }
  .choice.incorrect .bubble{ background: var(--incorrect); border-color: var(--incorrect); color:#fff; }
  .choice.disabled{ cursor:default; }
  .choice.disabled:hover{ border-color: inherit; }

  .gridin-wrap{ margin-bottom: 20px; }
  .gridin-label{ font-family: var(--mono); font-size:10.5px; color: var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .gridin-input{ font-family: var(--mono); font-size: 19px; padding: 11px 13px; border: 2px solid var(--ink-deep); width: 210px; background: var(--paper-raised); color: var(--ink-deep); }
  .gridin-input:focus{ outline: 2px solid var(--gold); outline-offset:2px; }
  .gridin-input.correct{ border-color: var(--correct); background: var(--correct-bg); }
  .gridin-input.incorrect{ border-color: var(--incorrect); background: var(--incorrect-bg); }
  .gridin-hint{ font-size:11.5px; color:var(--muted); margin-top:6px; }

  .qcontrols{ display:flex; align-items:center; justify-content:space-between; border-top: 1px solid var(--line); padding: 15px 30px; background: var(--paper); flex-wrap:wrap; gap:12px; }
  @media (max-width:560px){ .qcontrols{ padding:14px 16px; } }
  .nav-btns{ display:flex; gap:8px; }

  .rationale{ margin: 0 30px 20px; padding: 15px 17px; border-left: 4px solid var(--ink-deep); background: var(--paper); font-size: 14px; line-height: 1.6; color: var(--ink); }
  .rationale.correct-panel{ border-left-color: var(--correct); }
  .rationale.incorrect-panel{ border-left-color: var(--incorrect); }
  .rationale-head{ font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; font-weight:600; }
  .rationale-head.correct-text{ color: var(--correct); }
  .rationale-head.incorrect-text{ color: var(--incorrect); }
  @media (max-width:560px){ .rationale{ margin:0 16px 18px; } }

  .empty-state, .summary-state, .construction-state{ padding: 56px 30px; text-align:center; }
  .empty-state .big, .summary-state .big, .construction-state .big{ font-family: var(--serif); font-size: 23px; font-weight:700; margin-bottom:10px; }
  .empty-state p, .summary-state p, .construction-state p{ color: var(--muted); font-size:14px; max-width: 480px; margin:0 auto; }
  .construction-state{ padding: 80px 30px; }
  .construction-mark{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
    border: 1px solid var(--gold); display:inline-block; padding: 4px 12px; margin-bottom: 18px;
  }
  .construction-skills{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin: 20px 0 4px; max-width: 560px; margin-left:auto; margin-right:auto; }
  .construction-skills .tag{ background: var(--paper-raised); }

  .summary-table{ width:100%; border-collapse:collapse; margin-top:18px; text-align:left; }
  .summary-table th{ font-family: var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color: var(--muted); border-bottom: 2px solid var(--ink-deep); padding: 8px 10px; }
  .summary-table td{ padding: 9px 10px; border-bottom: 1px solid var(--line); font-size:13.5px; }
  .pill{ display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius: 20px; font-weight:600; }
  .pill.good{ background: var(--correct-bg); color: var(--correct); }
  .pill.bad{ background: var(--incorrect-bg); color: var(--incorrect); }
  .pill.mid{ background: var(--gold-soft); color: var(--gold); }

  footer.foot{ text-align:center; margin-top: 44px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  footer.foot a{ color: inherit; }
</style>
</head>
<body>

<div class="app">
  <header class="masthead">
    <div>
      <div class="wordmark" id="logoHome"><span class="free">1600</span><span class="sat">pls</span></div>
      <div class="tagline">Free practice toward a 1600. No login, no cost.</div>
    </div>
    <div class="masthead-sub" id="headerMeta"></div>
  </header>

  <nav class="nav-tabs" id="primaryTabs"></nav>

  <div id="pageRoot"></div>

  <footer class="foot">1600pls v<span id="versionTag"></span> — <a href="https://github.com/kktoast/1600pls/blob/main/CHANGELOG.md" target="_blank" rel="noopener">changelog</a></footer>
</div>

<script>
/* =========================================================
   QUESTION BANK — ALGEBRA (populated)
   ========================================================= */
const ALGEBRA_QUESTIONS = [
{ id:"7eea65e3", skill:"Systems of two linear equations in two variables", difficulty:"Medium", type:"mcq",
  question:"Which of the following systems of linear equations has no solution?",
  choices:[{k:"A",t:"\\(y = 6x + 3\\)<br>\\(y = 6x + 9\\)"},{k:"B",t:"\\(y = 10\\)<br>\\(y = 10x + 10\\)"},{k:"C",t:"\\(y = 14x + 14\\)<br>\\(y = 10x + 14\\)"},{k:"D",t:"\\(x = 3\\)<br>\\(y = 10\\)"}],
  answer:"A",
  rationale:"A system of two linear equations has no solution if the graphs of the lines are distinct and parallel — same slope, different y-intercepts. In choice A, both lines have slope 6, but y-intercepts 3 and 9, which are different. So the system has no solution. Choice B has a solution (0, 10). Choice C has a solution (0, 14). Choice D has a solution (3, 10)."
},
{ id:"2eb1f9e1", skill:"Linear equations in two variables", difficulty:"Medium", type:"grid",
  question:"A line in the \\(xy\\)-plane has a slope of \\(9\\) and passes through the point \\((0,-5)\\). The equation \\(y = px + r\\) defines the line, where \\(p\\) and \\(r\\) are constants. What is the value of \\(p\\)?",
  accept:["9"],
  rationale:"In \\(y = px + r\\), \\(p\\) represents the slope. Since the line has a slope of 9, \\(p = 9\\)."
},
{ id:"377a6aa4", skill:"Linear equations in one variable", difficulty:"Easy", type:"mcq",
  question:"If \\(3x - 8 = 7\\), what is the value of \\(3x + 8\\)?",

  log.push({domainKey, skill, correct, ts: Date.now()});
  saveLog(log);
}

function loadSessions(){
  try{ return JSON.parse(localStorage.getItem(LS_SESSIONS)) || []; } catch(e){ return []; }
}
function saveSessions(arr){ try{ localStorage.setItem(LS_SESSIONS, JSON.stringify(arr)); }catch(e){} }

function loadPredictions(){
  try{ return JSON.parse(localStorage.getItem(LS_PREDICTIONS)) || []; } catch(e){ return []; }
}
function savePredictions(arr){ try{ localStorage.setItem(LS_PREDICTIONS, JSON.stringify(arr)); }catch(e){} }

function computePredictedScore(){
  const log = loadLog();
  const domainsWithContent = DOMAINS.filter(d=>d.questions.length>0);
  if(domainsWithContent.length===0) return 500;
  let weightedSum=0, weightTotal=0;
  domainsWithContent.forEach(d=>{
    const attempts = log.filter(a=>a.domainKey===d.key);
    const acc = attempts.length ? attempts.filter(a=>a.correct).length/attempts.length : 0.5;
    weightedSum += d.weight*acc;
    weightTotal += d.weight;
  });
  const weightedAcc = weightedSum/weightTotal;
  return Math.round(200 + 600*weightedAcc);
}

function recordSessionCompletion(){
  const total = state.order.length;
  if(total === 0) return;
  const answeredIds = state.order.filter(id=>state.answered[id] && state.submitted[id]);
  const correct = answeredIds.filter(id=>state.answered[id].correct).length;
  const accuracy = answeredIds.length ? correct/answeredIds.length : 0;

  const sessions = loadSessions();
  sessions.push({ts: Date.now(), domainKey: state.domainKey, correct, answered: answeredIds.length, total, accuracy});
  saveSessions(sessions);

  const predictions = loadPredictions();
  predictions.push({ts: Date.now(), predictedScore: computePredictedScore()});
  savePredictions(predictions);
}

  domainKey: "algebra",

  activeSkills: new Set(),
  order: [],
  idx: 0,
  answered: {},
  submitted: {},
  gridValue: ""
};

function currentDomain(){ return DOMAINS.find(d=>d.key===state.domainKey); }
function allQuestionsById(){ return DOMAINS.flatMap(d=>d.questions); }
function byId(id){ return allQuestionsById().find(q=>q.id===id); }

function setDomain(key, skillFilter){
  state.domainKey = key;
  const d = currentDomain();
  state.activeSkills = skillFilter ? new Set([skillFilter]) : new Set(d.skills);
  state.activeDifficulties = new Set(DIFFICULTIES);
  state.idx = 0;
  rebuildOrder(false);
}

function shuffledIds(list){
  const arr = list.map(q=>q.id);
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function getFilteredQuestions(){
  const d = currentDomain();
  return d.questions.filter(q => state.activeDifficulties.has(q.difficulty) && state.activeSkills.has(q.skill));
}
function rebuildOrder(preserveIfPossible){
  const filtered = getFilteredQuestions();
  const filteredIds = new Set(filtered.map(q=>q.id));
  if(preserveIfPossible){
    state.order = state.order.filter(id=>filteredIds.has(id));
    const existing = new Set(state.order);
    filtered.forEach(q=>{ if(!existing.has(q.id)) state.order.push(q.id); });
  } else {
    state.order = filtered.map(q=>q.id);
  }
  if(state.idx >= state.order.length) state.idx = 0;
}

function computeLifetimeStats(){
  const log = loadLog();
  const answered = log.length;
  const correct = log.filter(a=>a.correct).length;
  const accuracy = answered ? Math.round((correct/answered)*100) : null;
  const scores = loadScores();
  const latest = scores.length ? scores[scores.length-1] : null;
  const totalQuestions = DOMAINS.reduce((s,d)=>s+d.questions.length,0);
  return {answered, correct, accuracy, latest, totalQuestions};
}

function computeRecommendations(){
  const log = loadLog();
  const recs = [];
  DOMAINS.forEach(d=>{
    if(d.questions.length === 0) return;
    d.skills.forEach(skill=>{
      const total = d.questions.filter(q=>q.skill===skill).length;
      if(total === 0) return;
      const attempts = log.filter(a=>a.domainKey===d.key && a.skill===skill);
      const correct = attempts.filter(a=>a.correct).length;
      const accuracy = attempts.length ? correct/attempts.length : null;
      const effectiveAcc = accuracy === null ? 0.35 : accuracy; // assume weak until proven
      const potential = Math.round(d.weight/d.skills.length * (1-effectiveAcc));
      recs.push({domainKey:d.key, domainLabel:d.label, skill, attempts:attempts.length, correct, accuracy, potential});
    });
  });
  recs.sort((a,b)=> b.potential - a.potential);
  return recs.slice(0,5);
}

function buildLineChart(points, minY, maxY, color, emptyMessage){
  const W=520,H=200,padL=42,padR=14,padT=14,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yFor = v => padT + plotH*(1-(v-minY)/(maxY-minY));
  const xFor = i => points.length<=1 ? padL+plotW/2 : padL + plotW*i/(points.length-1);
  const colorId = color.replace('#','');

  let gridLines = '';
  const steps = 4;
  for(let s=0; s<=steps; s++){
    const val = minY + (maxY-minY)*s/steps;
    const y = yFor(val);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E4E0D3" stroke-width="1"/>`;
    gridLines += `<text x="${padL-7}" y="${y+4}" font-family="IBM Plex Mono" font-size="11" fill="#6B7280" text-anchor="end">${Math.round(val)}</text>`;
  }

  if(points.length === 0){
    return `<svg viewBox="0 0 ${W} ${H}">${gridLines}<text x="${W/2}" y="${H/2}" font-family="IBM Plex Mono" font-size="12.5" fill="#6B7280" text-anchor="middle">${emptyMessage}</text></svg>`;
  }

  const pts = points.map((p,i)=>({x:xFor(i), y:yFor(p.value), label:p.label, value:p.value}));

  let linePath = `M ${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const midX=(pts[i-1].x+pts[i].x)/2, midY=(pts[i-1].y+pts[i].y)/2;
    linePath += ` Q ${pts[i-1].x},${pts[i-1].y} ${midX},${midY}`;
  }
  linePath += ` L ${pts[pts.length-1].x},${pts[pts.length-1].y}`;

  const baseline = padT+plotH;
  let areaPath = `M ${pts[0].x},${baseline} L ${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const midX=(pts[i-1].x+pts[i].x)/2, midY=(pts[i-1].y+pts[i].y)/2;
    areaPath += ` Q ${pts[i-1].x},${pts[i-1].y} ${midX},${midY}`;
  }
  areaPath += ` L ${pts[pts.length-1].x},${pts[pts.length-1].y} L ${pts[pts.length-1].x},${baseline} Z`;

  const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const labels = pts.map(p=>`<text x="${p.x}" y="${p.y-10}" font-family="IBM Plex Mono" font-size="11" fill="#101A30" text-anchor="middle" font-weight="600">${p.value}</text>`).join('');
  const xLabels = pts.map((p,i)=> (i%Math.ceil(pts.length/6||1)===0) ? `<text x="${p.x}" y="${H-8}" font-family="IBM Plex Mono" font-size="10" fill="#6B7280" text-anchor="middle">${p.label}</text>` : '').join('');

  return `<svg viewBox="0 0 ${W} ${H}">
    <defs>
      <linearGradient id="grad-${colorId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.26"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#grad-${colorId})"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}
    ${labels}
    ${xLabels}
  </svg>`;
}

function fmtDate(ts){ return new Date(ts).toISOString().slice(5,10); }

function scoreChartSVG(scores){
  const points = scores.map(s=>({label:s.date.slice(5), value:s.total}));
  return buildLineChart(points, 400, 1600, '#B9852E', 'No scores logged yet — add one below');
}

function predictedScoreChartSVG(predictions){
  const points = predictions.map(p=>({label:fmtDate(p.ts), value:p.predictedScore}));
  return buildLineChart(points, 200, 800, '#1C2B4A', 'Complete a practice set to generate your first prediction');
}

function improvementChartSVG(sessions){
  const points = sessions.map(s=>({label:fmtDate(s.ts), value:Math.round(s.accuracy*100)}));
  return buildLineChart(points, 0, 100, '#2E7D53', 'Complete a practice set to start tracking improvement');
}

function wireHome(){
  const dateInput = document.getElementById('scoreDate');
  const today = new Date().toISOString().slice(0,10);
  dateInput.value = today;

  document.getElementById('addScoreBtn').onclick = ()=>{
    const date = document.getElementById('scoreDate').value || today;
    const math = parseInt(document.getElementById('scoreMath').value,10);
    const rw = parseInt(document.getElementById('scoreRW').value,10);
    if(!math || !rw || math<200 || math>800 || rw<200 || rw>800){
      alert('Enter Math and R&W scores between 200 and 800.');
      return;
    }
    const scores = loadScores();
    scores.push({id: Date.now().toString(36), date, math, rw, total: math+rw});
    scores.sort((a,b)=> a.date.localeCompare(b.date));
    saveScores(scores);
    renderAll();
  };

  document.querySelectorAll('.score-table .del').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      const scores = loadScores().filter(s=>s.id!==id);
      saveScores(scores);
      renderAll();
    };
  });

  document.querySelectorAll('.rec-card [data-skill]').forEach(btn=>{
    btn.onclick = ()=>{
      state.primaryTab = 'math';
      setDomain(btn.dataset.domain, btn.dataset.skill);
      renderAll();
    };
  });
}

function mainPanelTemplate(){
  const d = currentDomain();
  const filtered = getFilteredQuestions();

  if(d.questions.length === 0){
    return `<div class="construction-state">
      <div class="construction-mark">Coming Soon</div>
      <div class="big">${d.label} questions are on the way</div>
      <p>This domain is wired up and ready — questions just haven't been loaded in yet. Here's what's planned:</p>
      <div class="construction-skills">${d.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
      <div style="margin-top:26px;"><button class="btn primary" id="goAlgebraBtn">Practice Algebra instead →</button></div>
    </div>`;
  }

  if(filtered.length === 0){
    return `<div class="empty-state"><div class="big">No questions match these filters</div><p>Select at least one skill and difficulty from the left to see practice questions.</p></div>`;
  }

  if(state.order.length === 0) rebuildOrder(false);
  if(state.idx >= state.order.length) return summaryTemplate(filtered);

  const qid = state.order[state.idx];
  const q = byId(qid);
  const submitted = !!state.submitted[qid];
  const chosen = state.answered[qid] ? state.answered[qid].chosen : null;

  let html = `
    <div class="qcard">
      <div class="qcard-topline">
        <div class="qcard-meta">
          <span class="tag difficulty-${q.difficulty}">${q.difficulty}</span>
          <span class="tag">${q.skill}</span>
          <span class="qid">ID ${q.id}</span>
        </div>
        <div class="qposition">Question ${state.idx+1} of ${state.order.length}</div>
      </div>
      <div class="qbody">${q.question}</div>
      ${q.figure ? `<div class="qfigure">${q.figure}</div>` : ''}
  `;

  if(q.type === 'mcq'){
    html += `<div class="choices">`;
    q.choices.forEach(c=>{
      let cls = 'choice';
      if(chosen===c.k) cls += ' selected';
      if(submitted){ cls += ' disabled'; if(c.k===q.answer) cls+=' correct'; else if(chosen===c.k) cls+=' incorrect'; }
      html += `<div class="${cls}" data-key="${c.k}">
        <div class="bubble">${c.k}</div><div class="choice-text">${c.t}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    let inputCls = 'gridin-input';
    if(submitted){ inputCls += state.answered[qid].correct ? ' correct' : ' incorrect'; }
    html += `<div class="gridin-wrap">
      <div class="gridin-label">Enter your answer</div>
      <input type="text" class="${inputCls}" id="gridInput" value="${chosen!==null&&chosen!==undefined?chosen:''}" ${submitted?'disabled':''} placeholder="e.g. 3/2 or 1.5" autocomplete="off"/>
      <div class="gridin-hint">Fractions (3/2), decimals (1.5), and negative signs are all accepted.</div>
    </div>`;
  }

  html += `</div>`;

  if(submitted){
    const isCorrect = state.answered[qid].correct;
    html += `<div class="rationale ${isCorrect?'correct-panel':'incorrect-panel'}">
      <div class="rationale-head ${isCorrect?'correct-text':'incorrect-text'}">${isCorrect?"Correct — here's why":"Not quite — here's why"}</div>
      ${q.type==='mcq' ? `<div style="margin-bottom:8px;">Correct answer: <b>${q.answer}</b></div>` : `<div style="margin-bottom:8px;">Correct answer: <b>${q.accept[0]}</b></div>`}
      <div>${q.rationale}</div>
    </div>`;
  }

  html += `
    <div class="qcontrols">
      <div class="nav-btns">
        <button class="btn" id="prevBtn" ${state.idx===0?'disabled':''}>← Previous</button>
        <button class="btn" id="skipBtn">Skip →</button>
      </div>
      <div class="nav-btns">
        ${!submitted ? `<button class="btn primary" id="checkBtn">Check Answer</button>` : `<button class="btn gold" id="nextBtn">Next Question →</button>`}
      </div>
    </div>
  `;
  return html;
}

function summaryTemplate(filtered){
  const filteredIds = new Set(filtered.map(q=>q.id));
  const answeredIds = Object.keys(state.answered).filter(id=>filteredIds.has(id));
  const correctCount = answeredIds.filter(id=>state.answered[id].correct).length;
  const bySkill = {};
  filtered.forEach(q=>{
    if(!bySkill[q.skill]) bySkill[q.skill] = {total:0, answered:0, correct:0};
    bySkill[q.skill].total++;
    if(state.answered[q.id]){ bySkill[q.skill].answered++; if(state.answered[q.id].correct) bySkill[q.skill].correct++; }
  });
  let rows = '';
  Object.keys(bySkill).forEach(s=>{
    const d = bySkill[s];
    let pillClass='mid', pillText='—';
    if(d.answered>0){ const pct=Math.round((d.correct/d.answered)*100); pillClass = pct>=80?'good':(pct>=50?'mid':'bad'); pillText = pct+'%'; }
    rows += `<tr><td>${s}</td><td>${d.answered}/${d.total}</td><td>${d.correct}</td><td><span class="pill ${pillClass}">${pillText}</span></td></tr>`;
  });
  return `<div class="summary-state">
    <div class="big">Set complete — ${correctCount}/${answeredIds.length||0} correct</div>
    <p>You've gone through every question in the current filter. Review your breakdown below, or restart to try again.</p>
    <table class="summary-table"><tr><th>Skill</th><th>Answered</th><th>Correct</th><th>Accuracy</th></tr>${rows}</table>
    <div style="margin-top:22px; display:flex; gap:10px; justify-content:center;">
      <button class="btn primary" id="retrySameBtn">Retry same set</button>
      <button class="btn gold" id="retryShuffleBtn">Shuffle &amp; retry</button>
    </div>
  </div>`;
}

function renderMathBody(){
  document.getElementById('sidebarWrap').innerHTML = sidebarTemplate();
  document.getElementById('mainPanel').innerHTML = mainPanelTemplate();
  renderMath(document.getElementById('mainPanel'));
  wireMathBody();
}

function wireMath(){
  document.querySelectorAll('.domain-tab').forEach(btn=>{
    btn.onclick = ()=>{ setDomain(btn.dataset.key); mathTemplateRerender(); };
  });
  wireMathBody();
  renderMath(document.getElementById('mainPanel'));
}

function mathTemplateRerender(){
  document.getElementById('pageRoot').innerHTML = mathTemplate();
  wireMath();
}

function wireMathBody(){
  const resetBtn = document.getElementById('resetFiltersBtn');
  if(resetBtn) resetBtn.onclick = ()=>{
    const d = currentDomain();
    state.activeDifficulties = new Set(DIFFICULTIES);
    state.activeSkills = new Set(d.skills);
    d.questions.forEach(q=>{ delete state.answered[q.id]; delete state.submitted[q.id]; q._chosen=null; });
    rebuildOrder(false);
    renderMathBody();
  };

  document.querySelectorAll('.chip[data-diff]').forEach(chip=>{
    chip.onclick = ()=>{
      const diff = chip.dataset.diff;
      if(state.activeDifficulties.has(diff)){ if(state.activeDifficulties.size>1) state.activeDifficulties.delete(diff); }
      else state.activeDifficulties.add(diff);
      rebuildOrder(true);
      renderMathBody();
    };
  });

  document.querySelectorAll('.skill-item input[data-skill]').forEach(input=>{
    input.onchange = (e)=>{
      const s = input.dataset.skill;
      if(e.target.checked) state.activeSkills.add(s);
      else { if(state.activeSkills.size>1) state.activeSkills.delete(s); else e.target.checked=true; }
      rebuildOrder(true);
      renderMathBody();
    };
  });

  document.querySelectorAll('.choice[data-key]').forEach(el=>{
    el.onclick = ()=>{
      const qid = state.order[state.idx];
      if(state.submitted[qid]) return;
      const q = byId(qid);
      q._chosen = el.dataset.key;
      document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected', c.dataset.key===el.dataset.key));
    };
  });

  const gridInput = document.getElementById('gridInput');
  if(gridInput){
    gridInput.addEventListener('input', ()=>{ state.gridValue = gridInput.value; });
    gridInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleCheck(); });
  }

  const checkBtn = document.getElementById('checkBtn');
  if(checkBtn) checkBtn.onclick = handleCheck;
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{ goNext(); };
  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.onclick = ()=>{ goPrev(); };
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.onclick = ()=>{ goNext(); };
  const retrySame = document.getElementById('retrySameBtn');
  if(retrySame) retrySame.onclick = ()=>{ restartSet(false); };
  const retryShuffle = document.getElementById('retryShuffleBtn');
  if(retryShuffle) retryShuffle.onclick = ()=>{ restartSet(true); };
  const goAlgebra = document.getElementById('goAlgebraBtn');
  if(goAlgebra) goAlgebra.onclick = ()=>{ setDomain('algebra'); mathTemplateRerender(); };
  const goMath = document.getElementById('goMathBtn');
  if(goMath) goMath.onclick = ()=>{ state.primaryTab='math'; renderAll(); };
}

function normalizeNumeric(str){
  if(str===undefined||str===null) return null;
  str = String(str).trim();
  if(str==='') return null;
  if(str.includes('/')){
    const parts = str.split('/');
    if(parts.length===2){ const n=parseFloat(parts[0]), dd=parseFloat(parts[1]); if(!isNaN(n)&&!isNaN(dd)&&dd!==0) return n/dd; }
    return NaN;
  }
  const v = parseFloat(str);
  return isNaN(v) ? NaN : v;
}

function handleCheck(){
  const qid = state.order[state.idx];
  const q = byId(qid);
  let chosen, correct;
  if(q.type==='mcq'){
    chosen = q._chosen || null;
    if(!chosen) return;
    correct = (chosen === q.answer);
  } else {
    const input = document.getElementById('gridInput');
    chosen = input ? input.value.trim() : '';
    if(chosen==='') return;
    const userVal = normalizeNumeric(chosen);
    correct = q.accept.some(a=>{
      const accVal = normalizeNumeric(a);
      if(isNaN(userVal)||isNaN(accVal)) return chosen===a;
      return Math.abs(userVal-accVal) < 0.02;
    });
  }
  state.answered[qid] = {chosen, correct};
  state.submitted[qid] = true;
  state.gridValue = '';
  logAttempt(state.domainKey, q.skill, correct);
  renderMathBody();
}

function goNext(){
  if(state.idx < state.order.length){
    state.idx++;
    state.gridValue='';
    if(state.idx === state.order.length){
      recordSessionCompletion();
    }
    renderMathBody();
  }
}
function goPrev(){ if(state.idx > 0){ state.idx--; state.gridValue=''; renderMathBody(); } }

function restartSet(shuffle){
  const filtered = getFilteredQuestions();
  state.order = shuffle ? shuffledIds(filtered) : filtered.map(q=>q.id);
  state.idx = 0;
  filtered.forEach(q=>{ delete state.answered[q.id]; delete state.submitted[q.id]; q._chosen=null; });
  renderMathBody();
}

function renderMath(container){
  if(window.renderMathInElement){
    renderMathInElement(container, {
      delimiters: [{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],
      throwOnError:false
    });
  }
}

/* =========================================================
   INIT
   ========================================================= */
state.activeSkills = new Set(currentDomain().skills);
rebuildOrder(false);
renderAll();
</script>
