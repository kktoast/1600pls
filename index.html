<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freeSAT — Free SAT Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
  :root{
    --paper: #F5F3EC;
    --paper-raised: #FFFFFF;
    --ink: #1C2B4A;
    --ink-deep: #101A30;
    --gold: #B9852E;
    --gold-soft: #E9D9B8;
    --correct: #2E7D53;
    --correct-bg: #E4F1E9;
    --incorrect: #B23A3A;
    --incorrect-bg: #F6E6E4;
    --line: #D9D4C7;
    --muted: #6B7280;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --serif: 'Source Serif 4', serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink-deep);
    font-family: var(--sans);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    background-attachment: fixed;
    min-height: 100vh;
  }

  .app{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Masthead / wordmark ---------- */
  header.masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 3px solid var(--ink-deep);
    padding-bottom: 14px;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .wordmark{
    font-family: var(--serif);
    font-weight: 700;
    font-size: 36px;
    letter-spacing: -0.01em;
    color: var(--ink-deep);
    display:flex;
    align-items:baseline;
    gap: 2px;
  }
  .wordmark .free{ color: var(--muted); font-weight: 400; }
  .wordmark .sat{ color: var(--ink-deep); border-bottom: 4px solid var(--gold); padding-bottom: 1px; }
  .tagline{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .masthead-sub{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    text-align:right;
  }

  /* ---------- Primary nav tabs ---------- */
  .nav-tabs{
    display:flex;
    gap: 4px;
    margin: 0 0 18px;
    border-bottom: 1px solid var(--line);
  }
  .nav-tab{
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 12px 18px 10px;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    display:flex;
    align-items:center;
    gap:8px;
    transition: color .12s ease, border-color .12s ease;
    background:none;
    border-top:none; border-left:none; border-right:none;
  }
  .nav-tab:hover{ color: var(--ink-deep); }
  .nav-tab.active{ color: var(--ink-deep); border-bottom-color: var(--gold); font-weight:600; }
  .soon-badge{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 2px 6px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  /* ---------- Domain sub-tabs ---------- */
  .domain-tabs{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .domain-tab{
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition: all .12s ease;
  }
  .domain-tab:hover{ border-color: var(--ink); }
  .domain-tab.active{ background: var(--ink-deep); border-color: var(--ink-deep); color: var(--paper-raised); }
  .domain-tab .dcount{
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 20px;
    background: var(--gold-soft);
    color: var(--gold);
  }
  .domain-tab.active .dcount{ background: rgba(255,255,255,0.18); color: var(--paper-raised); }
  .domain-tab.empty .dcount{ background: var(--line); color: var(--muted); }
  .domain-tab.active.empty .dcount{ background: rgba(255,255,255,0.12); color: var(--paper-raised); }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 270px 1fr;
    gap: 24px;
    align-items:start;
  }
  .layout.single-col{ grid-template-columns: 1fr; }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */
  .panel{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(28,43,74,0.03);
  }
  .sidebar .panel{ padding: 18px 18px 20px; margin-bottom: 18px; }
  .panel-title{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 600;
    margin: 0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title::before{
    content:"";
    width:6px; height:6px;
    background: var(--gold);
    display:inline-block;
  }

  .filter-group{ margin-bottom: 16px; }
  .filter-group:last-child{ margin-bottom:0; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    user-select:none;
    transition: all .12s ease;
    line-height:1.2;
  }
  .chip:hover{ border-color: var(--ink); }
  .chip.active{
    background: var(--ink-deep);
    color: var(--paper-raised);
    border-color: var(--ink-deep);
  }
  .chip.diff-easy.active{ background: var(--correct); border-color:var(--correct); }
  .chip.diff-medium.active{ background: var(--gold); border-color:var(--gold); }
  .chip.diff-hard.active{ background: var(--incorrect); border-color:var(--incorrect); }

  .skill-list{ display:flex; flex-direction:column; gap:2px; }
  .skill-item{
    display:flex; align-items:center; gap:9px;
    font-size: 13px;
    padding: 6px 4px;
    cursor:pointer;
    border-bottom: 1px dashed transparent;
  }
  .skill-item:hover{ background: var(--paper); }
  .skill-item.disabled{ cursor: default; opacity: 0.5; }
  .skill-item.disabled:hover{ background: none; }
  .skill-item input{ accent-color: var(--ink-deep); width:14px; height:14px; flex-shrink:0; }
  .skill-item .count{ margin-left:auto; font-family:var(--mono); font-size:11px; color: var(--muted); }

  .reset-btn{
    width:100%;
    margin-top: 14px;
    background: transparent;
    border: 1px solid var(--ink-deep);
    color: var(--ink-deep);
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px;
    cursor: pointer;
  }
  .reset-btn:hover{ background: var(--ink-deep); color: var(--paper-raised); }

  /* ---------- Progress ring panel ---------- */
  .score-panel{ text-align:center; }
  .score-ring-wrap{ position:relative; width:120px; height:120px; margin: 6px auto 12px; }
  .score-ring-wrap svg{ transform: rotate(-90deg); }
  .score-ring-bg{ fill:none; stroke: var(--line); stroke-width: 9; }
  .score-ring-fg{ fill:none; stroke: var(--gold); stroke-width: 9; stroke-linecap: butt; transition: stroke-dashoffset .4s ease; }
  .score-ring-label{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-ring-label .num{ font-family: var(--serif); font-weight:700; font-size: 26px; color: var(--ink-deep); }
  .score-ring-label .lbl{ font-family: var(--mono); font-size: 9.5px; color: var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .score-stats{
    display:flex; justify-content:space-between;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px;
  }
  .score-stats b{ color: var(--ink-deep); font-size: 13px; }

  /* ---------- Main / question area ---------- */
  .main .panel{ padding: 0; }
  .qcard{ padding: 28px 32px 30px; }
  @media (max-width: 560px){ .qcard{ padding: 20px 16px 24px; } }

  .qcard-topline{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px; flex-wrap:wrap; gap:10px;
  }
  .qcard-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tag{
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 4px 9px;
    border: 1px solid var(--line);
    color: var(--ink);
    background: var(--paper);
  }
  .tag.difficulty-Easy{ border-color: var(--correct); color: var(--correct); }
  .tag.difficulty-Medium{ border-color: var(--gold); color: var(--gold); }
  .tag.difficulty-Hard{ border-color: var(--incorrect); color: var(--incorrect); }
  .qid{ font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .qposition{ font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .qbody{
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink-deep);
    margin-bottom: 22px;
  }
  .qbody p{ margin: 0 0 10px; }

  .qfigure{
    display:flex; justify-content:center;
    margin: 8px 0 20px;
    padding: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .qfigure table{ border-collapse: collapse; font-family: var(--mono); font-size: 15px; }
  .qfigure td, .qfigure th{ border: 1px solid var(--ink); padding: 6px 16px; text-align:center; }
  .qfigure th{ background: var(--gold-soft); }

  /* ---------- Answer choices (scantron) ---------- */
  .choices{ display:flex; flex-direction:column; gap:10px; margin-bottom: 22px; }
  .choice{
    display:flex; align-items:center; gap:14px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    cursor:pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .choice:hover{ border-color: var(--ink); }
  .bubble{
    flex-shrink:0;
    width: 30px; height:30px; border-radius:50%;
    border: 2px solid var(--ink-deep);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-weight:600; font-size:13px; color: var(--ink-deep);
    background: var(--paper-raised);
    transition: all .12s ease;
  }
  .choice.selected .bubble{ background: var(--ink-deep); color: var(--paper-raised); }
  .choice-text{ font-size: 16px; color: var(--ink-deep); }
  .choice-text .katex{ font-size: 1.05em; }

  .choice.correct{ border-color: var(--correct); background: var(--correct-bg); }
  .choice.correct .bubble{ background: var(--correct); border-color: var(--correct); color:#fff; }
  .choice.incorrect{ border-color: var(--incorrect); background: var(--incorrect-bg); }
  .choice.incorrect .bubble{ background: var(--incorrect); border-color: var(--incorrect); color:#fff; }
  .choice.disabled{ cursor:default; }
  .choice.disabled:hover{ border-color: inherit; }

  .gridin-wrap{ margin-bottom: 22px; }
  .gridin-label{ font-family: var(--mono); font-size:11px; color: var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .gridin-input{
    font-family: var(--mono);
    font-size: 20px;
    padding: 12px 14px;
    border: 2px solid var(--ink-deep);
    width: 220px;
    background: var(--paper-raised);
    color: var(--ink-deep);
  }
  .gridin-input:focus{ outline: 2px solid var(--gold); outline-offset:2px; }
  .gridin-input.correct{ border-color: var(--correct); background: var(--correct-bg); }
  .gridin-input.incorrect{ border-color: var(--incorrect); background: var(--incorrect-bg); }
  .gridin-hint{ font-size:12px; color:var(--muted); margin-top:6px; }

  /* ---------- Controls ---------- */
  .qcontrols{
    display:flex; align-items:center; justify-content:space-between;
    border-top: 1px solid var(--line);
    padding: 16px 32px;
    background: var(--paper);
    flex-wrap:wrap; gap:12px;
  }
  @media (max-width:560px){ .qcontrols{ padding:14px 16px; } }
  .btn{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: 1px solid var(--ink-deep);
    background: var(--paper-raised);
    color: var(--ink-deep);
    cursor: pointer;
    transition: all .12s ease;
  }
  .btn:hover:not(:disabled){ background: var(--ink-deep); color: var(--paper-raised); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.primary{ background: var(--ink-deep); color: var(--paper-raised); }
  .btn.primary:hover:not(:disabled){ background: var(--ink); }
  .btn.gold{ border-color: var(--gold); color:var(--gold); }
  .btn.gold:hover:not(:disabled){ background:var(--gold); color:#fff; }
  .nav-btns{ display:flex; gap:8px; }

  /* ---------- Rationale ---------- */
  .rationale{
    margin: 0 32px 22px;
    padding: 16px 18px;
    border-left: 4px solid var(--ink-deep);
    background: var(--paper);
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .rationale.correct-panel{ border-left-color: var(--correct); }
  .rationale.incorrect-panel{ border-left-color: var(--incorrect); }
  .rationale-head{
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    font-weight:600;
  }
  .rationale-head.correct-text{ color: var(--correct); }
  .rationale-head.incorrect-text{ color: var(--incorrect); }
  @media (max-width:560px){ .rationale{ margin:0 16px 18px; } }

  /* ---------- Empty / summary / construction states ---------- */
  .empty-state, .summary-state, .construction-state{
    padding: 60px 30px;
    text-align:center;
  }
  .empty-state .big, .summary-state .big, .construction-state .big{
    font-family: var(--serif); font-size: 24px; font-weight:700; margin-bottom:10px;
  }
  .empty-state p, .summary-state p, .construction-state p{ color: var(--muted); font-size:14px; max-width: 480px; margin:0 auto; }

  .construction-state{ padding: 90px 30px; }
  .construction-mark{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    display:inline-block;
    padding: 4px 12px;
    margin-bottom: 18px;
  }
  .construction-skills{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin: 22px 0 6px;
    max-width: 560px; margin-left:auto; margin-right:auto;
  }
  .construction-skills .tag{ background: var(--paper-raised); }

  .summary-table{ width:100%; border-collapse:collapse; margin-top:20px; text-align:left; }
  .summary-table th{
    font-family: var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color: var(--muted); border-bottom: 2px solid var(--ink-deep); padding: 8px 10px;
  }
  .summary-table td{ padding: 9px 10px; border-bottom: 1px solid var(--line); font-size:13.5px; }
  .summary-table tr:hover td{ background: var(--paper); }
  .pill{
    display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px;
    border-radius: 20px; font-weight:600;
  }
  .pill.good{ background: var(--correct-bg); color: var(--correct); }
  .pill.bad{ background: var(--incorrect-bg); color: var(--incorrect); }
  .pill.mid{ background: var(--gold-soft); color: var(--gold); }

  footer.foot{
    text-align:center; margin-top: 40px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
</style>
</head>
<body>

<div class="app">

  <header class="masthead">
    <div>
      <div class="wordmark"><span class="free">free</span><span class="sat">SAT</span></div>
      <div class="tagline">Real SAT-style questions. No login, no cost.</div>
    </div>
    <div class="masthead-sub" id="headerMeta"></div>
  </header>

  <nav class="nav-tabs" id="primaryTabs"></nav>
  <div id="domainTabsWrap"></div>

  <div class="layout" id="layoutWrap">

    <aside class="sidebar" id="sidebarWrap">

      <div class="panel score-panel">
        <div class="panel-title">Session Score</div>
        <div class="score-ring-wrap">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle class="score-ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="score-ring-fg" id="scoreRing" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
          </svg>
          <div class="score-ring-label">
            <div class="num" id="scorePct">—</div>
            <div class="lbl">Correct</div>
          </div>
        </div>
        <div class="score-stats">
          <div>Answered<br><b id="statAnswered">0</b></div>
          <div>Correct<br><b id="statCorrect">0</b></div>
          <div>In Set<br><b id="statTotal">0</b></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Difficulty</div>
        <div class="chip-row" id="difficultyChips"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Skill</div>
        <div class="skill-list" id="skillList"></div>
      </div>

      <div class="panel">
        <button class="reset-btn" id="resetFiltersBtn">Reset filters &amp; score</button>
      </div>

    </aside>

    <main class="main">
      <div class="panel" id="mainPanel"></div>
    </main>

  </div>

  <footer class="foot">freeSAT — Math domain · built from official-style SAT question banks</footer>
</div>

<script>
/* =========================================================
   QUESTION BANK — ALGEBRA (populated)
   ========================================================= */
const ALGEBRA_QUESTIONS = [
{
  id:"7eea65e3", skill:"Systems of two linear equations in two variables", difficulty:"Medium", type:"mcq",
  question:"Which of the following systems of linear equations has no solution?",
  choices:[
    {k:"A", t:"\\(y = 6x + 3\\)<br>\\(y = 6x + 9\\)"},
    {k:"B", t:"\\(y = 10\\)<br>\\(y = 10x + 10\\)"},
    {k:"C", t:"\\(y = 14x + 14\\)<br>\\(y = 10x + 14\\)"},
    {k:"D", t:"\\(x = 3\\)<br>\\(y = 10\\)"}
  ],
  answer:"A",
  rationale:"A system of two linear equations has no solution if the graphs of the lines are distinct and parallel — same slope, different y-intercepts. In choice A, both lines have slope 6, but y-intercepts 3 and 9, which are different. So the system has no solution. Choice B has a solution (0, 10). Choice C has a solution (0, 14). Choice D has a solution (3, 10)."
},
{
  id:"2eb1f9e1", skill:"Linear equations in two variables", difficulty:"Medium", type:"grid",
  question:"A line in the \\(xy\\)-plane has a slope of \\(9\\) and passes through the point \\((0,-5)\\). The equation \\(y = px + r\\) defines the line, where \\(p\\) and \\(r\\) are constants. What is the value of \\(p\\)?",
  accept:["9"],
  rationale:"In \\(y = px + r\\), \\(p\\) represents the slope. Since the line has a slope of 9, \\(p = 9\\)."
},
{
  id:"377a6aa4", skill:"Linear equations in one variable", difficulty:"Easy", type:"mcq",
  question:"If \\(3x - 8 = 7\\), what is the value of \\(3x + 8\\)?",
  choices:[
    {k:"A", t:"\\(-1\\)"},
    {k:"B", t:"\\(5\\)"},
    {k:"C", t:"\\(13\\)"},
    {k:"D", t:"\\(23\\)"}
  ],
  answer:"D",
  rationale:"Adding 8 to both sides of \\(3x-8=7\\) gives \\(3x=15\\). Adding 8 again gives \\(3x+8=23\\). Choice B is the value of \\(x\\), not \\(3x+8\\)."
},
{
  id:"5c1751d6", skill:"Linear functions", difficulty:"Medium", type:"grid",
  question:"The table shows four values of \\(x\\) and their corresponding values of \\(f(x)\\). There is a linear relationship between \\(x\\) and \\(f(x)\\) that is defined by the equation \\(f(x) = mx - 28\\), where \\(m\\) is a constant. What is the value of \\(m\\)?",
  figure:`<table><tr><th>x</th><td>10</td><td>15</td><td>20</td><td>25</td></tr><tr><th>f(x)</th><td>82</td><td>137</td><td>192</td><td>247</td></tr></table>`,
  accept:["11"],
  rationale:"When \\(x=10\\), \\(f(x)=82\\). Substituting: \\(82 = m(10) - 28\\), so \\(110 = 10m\\), giving \\(m = 11\\)."
},
{
  id:"e056a89f", skill:"Systems of two linear equations in two variables", difficulty:"Easy", type:"mcq",
  question:"\\(x = 5\\)<br>\\(y = x - 8\\)<br><br>Which of the following points \\((x, y)\\) is the solution to the given system of equations in the \\(xy\\)-plane?",
  choices:[
    {k:"A", t:"\\((0, 0)\\)"},

  rebuildOrder(false);
}

function shuffledIds(list){
  const arr = list.map(q=>q.id);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getFilteredQuestions(){
  const d = currentDomain();
  return d.questions.filter(q => state.activeDifficulties.has(q.difficulty) && state.activeSkills.has(q.skill));
}

function rebuildOrder(preserveIfPossible){
  const filtered = getFilteredQuestions();
  const filteredIds = new Set(filtered.map(q=>q.id));
  if(preserveIfPossible){
    state.order = state.order.filter(id=>filteredIds.has(id));
    const existing = new Set(state.order);
    filtered.forEach(q=>{ if(!existing.has(q.id)) state.order.push(q.id); });
  } else {
    state.order = filtered.map(q=>q.id);
  }
  if(state.idx >= state.order.length) state.idx = 0;
}

/* =========================================================
   RENDER: TOP NAV
   ========================================================= */
function renderPrimaryTabs(){
  const wrap = document.getElementById('primaryTabs');
  wrap.innerHTML = `
    <button class="nav-tab ${state.primaryTab==='math'?'active':''}" id="tabMath">Math</button>
    <button class="nav-tab ${state.primaryTab==='rw'?'active':''}" id="tabRW">Reading &amp; Writing <span class="soon-badge">Under Construction</span></button>
  `;
  document.getElementById('tabMath').onclick = ()=>{ state.primaryTab='math'; renderAll(); };
  document.getElementById('tabRW').onclick = ()=>{ state.primaryTab='rw'; renderAll(); };
}

function renderDomainTabs(){
  const wrap = document.getElementById('domainTabsWrap');
  if(state.primaryTab !== 'math'){ wrap.innerHTML=''; return; }
  let html = `<div class="domain-tabs">`;
  DOMAINS.forEach(d=>{
    const isEmpty = d.questions.length === 0;
    html += `<button class="domain-tab ${d.key===state.domainKey?'active':''} ${isEmpty?'empty':''}" data-key="${d.key}">
      ${d.label} <span class="dcount">${isEmpty ? 'Soon' : d.questions.length}</span>
    </button>`;
  });
  html += `</div>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('.domain-tab').forEach(btn=>{
    btn.onclick = ()=>{ setDomain(btn.dataset.key); renderAll(); };
  });
}

/* =========================================================
   RENDER: SIDEBAR
   ========================================================= */
function renderSidebar(){
  const sidebarWrap = document.getElementById('sidebarWrap');
  const layoutWrap = document.getElementById('layoutWrap');

  if(state.primaryTab !== 'math'){
    sidebarWrap.style.display = 'none';
    layoutWrap.classList.add('single-col');
    return;
  }
  sidebarWrap.style.display = '';
  layoutWrap.classList.remove('single-col');

  const d = currentDomain();

  const diffWrap = document.getElementById('difficultyChips');
  diffWrap.innerHTML = '';
  DIFFICULTIES.forEach(diff=>{
    const chip = document.createElement('div');
    chip.className = 'chip diff-'+diff.toLowerCase() + (state.activeDifficulties.has(diff) ? ' active' : '');
    chip.textContent = diff;
    chip.onclick = ()=>{
      if(state.activeDifficulties.has(diff)){
        if(state.activeDifficulties.size>1) state.activeDifficulties.delete(diff);
      } else {
        state.activeDifficulties.add(diff);
      }
      rebuildOrder(true);
      renderSidebar();
      renderMain();
    };
    diffWrap.appendChild(chip);
  });

  const skillWrap = document.getElementById('skillList');
  skillWrap.innerHTML = '';
  d.skills.forEach(s=>{
    const count = d.questions.filter(q=>q.skill===s).length;
    const disabled = count === 0;
    const row = document.createElement('label');
    row.className = 'skill-item' + (disabled ? ' disabled' : '');
    row.innerHTML = `<input type="checkbox" ${state.activeSkills.has(s)?'checked':''} ${disabled?'disabled':''}/> <span>${s}</span><span class="count">${count}</span>`;
    if(!disabled){
      row.querySelector('input').onchange = (e)=>{
        if(e.target.checked) state.activeSkills.add(s);
        else {
          if(state.activeSkills.size>1) state.activeSkills.delete(s);
          else e.target.checked = true;
        }
        rebuildOrder(true);
        renderSidebar();
        renderMain();
      };
    }
    skillWrap.appendChild(row);
  });

  renderScore();
}

function renderScore(){
  if(state.primaryTab !== 'math'){ return; }
  const filtered = getFilteredQuestions();
  const filteredIds = new Set(filtered.map(q=>q.id));
  const answeredIds = Object.keys(state.answered).filter(id=>filteredIds.has(id));
  const correctCount = answeredIds.filter(id=>state.answered[id].correct).length;
  const total = filtered.length;
  const pct = answeredIds.length ? Math.round((correctCount/answeredIds.length)*100) : null;

  document.getElementById('statAnswered').textContent = answeredIds.length;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('scorePct').textContent = pct===null ? '—' : pct+'%';

  const circumference = 326.7;
  const ring = document.getElementById('scoreRing');
  const frac = pct===null ? 0 : pct/100;
  ring.style.strokeDashoffset = circumference * (1-frac);

  const totalLoaded = DOMAINS.reduce((sum,d)=>sum+d.questions.length,0);
  document.getElementById('headerMeta').textContent = `${totalLoaded} question${totalLoaded===1?'':'s'} live across Math`;
}

/* =========================================================
   RENDER: MAIN
   ========================================================= */
function renderMain(){
  const panel = document.getElementById('mainPanel');

  if(state.primaryTab === 'rw'){
    panel.innerHTML = `<div class="construction-state">
      <div class="construction-mark">Under Construction</div>
      <div class="big">Reading &amp; Writing is on the way</div>
      <p>The Math section is fully stocked and ready to practice. Reading &amp; Writing question sets — Craft and Structure, Information and Ideas, Standard English Conventions, and Expression of Ideas — are being built next.</p>
      <div style="margin-top:26px;">
        <button class="btn primary" onclick="goToMath()">Practice Math instead →</button>
      </div>
    </div>`;
    return;
  }

  const d = currentDomain();
  const filtered = getFilteredQuestions();

  if(d.questions.length === 0){
    panel.innerHTML = `<div class="construction-state">
      <div class="construction-mark">Coming Soon</div>
      <div class="big">${d.label} questions are on the way</div>
      <p>This domain is wired up and ready — questions just haven't been loaded in yet. Here's what's planned:</p>
      <div class="construction-skills">
        ${d.skills.map(s=>`<span class="tag">${s}</span>`).join('')}
      </div>
      <div style="margin-top:26px;">
        <button class="btn primary" onclick="setDomain('algebra'); renderAll();">Practice Algebra instead →</button>
      </div>
    </div>`;
    return;
  }

  if(filtered.length === 0){
    panel.innerHTML = `<div class="empty-state">
      <div class="big">No questions match these filters</div>
      <p>Select at least one skill and difficulty from the left to see practice questions.</p>
    </div>`;
    return;
  }

  if(state.order.length === 0) rebuildOrder(false);

  if(state.idx >= state.order.length){
    renderSummary(panel, filtered);
    return;
  }

  const qid = state.order[state.idx];
  const q = byId(qid);
  const submitted = !!state.submitted[qid];
  const chosen = state.answered[qid] ? state.answered[qid].chosen : null;

  let bodyHtml = `
    <div class="qcard">
      <div class="qcard-topline">
        <div class="qcard-meta">
          <span class="tag difficulty-${q.difficulty}">${q.difficulty}</span>
          <span class="tag">${q.skill}</span>
          <span class="qid">ID ${q.id}</span>
        </div>
        <div class="qposition">Question ${state.idx+1} of ${state.order.length}</div>
      </div>
      <div class="qbody">${q.question}</div>
      ${q.figure ? `<div class="qfigure">${q.figure}</div>` : ''}
  `;

  if(q.type === 'mcq'){
    bodyHtml += `<div class="choices">`;
    q.choices.forEach(c=>{
      let cls = 'choice';
      if(chosen === c.k) cls += ' selected';
      if(submitted){
        cls += ' disabled';
        if(c.k === q.answer) cls += ' correct';
        else if(chosen === c.k) cls += ' incorrect';
      }
      bodyHtml += `<div class="${cls}" data-key="${c.k}" onclick="handleChoiceClick('${q.id}','${c.k}')">
        <div class="bubble">${c.k}</div>
        <div class="choice-text">${c.t}</div>
      </div>`;
    });
    bodyHtml += `</div>`;
  } else {
    let inputCls = 'gridin-input';
    if(submitted){
      inputCls += state.answered[qid].correct ? ' correct' : ' incorrect';
    }
    bodyHtml += `<div class="gridin-wrap">
      <div class="gridin-label">Enter your answer</div>
      <input type="text" class="${inputCls}" id="gridInput" value="${chosen!==null && chosen!==undefined ? chosen : ''}" ${submitted?'disabled':''} placeholder="e.g. 3/2 or 1.5" autocomplete="off"/>
      <div class="gridin-hint">Fractions (3/2), decimals (1.5), and negative signs are all accepted.</div>
    </div>`;
  }

  bodyHtml += `</div>`;

  if(submitted){
    const isCorrect = state.answered[qid].correct;
    bodyHtml += `<div class="rationale ${isCorrect?'correct-panel':'incorrect-panel'}">
      <div class="rationale-head ${isCorrect?'correct-text':'incorrect-text'}">${isCorrect?'Correct — here\'s why':'Not quite — here\'s why'}</div>
      ${q.type==='mcq' ? `<div style="margin-bottom:8px;">Correct answer: <b>${q.answer}</b></div>` : `<div style="margin-bottom:8px;">Correct answer: <b>${q.accept[0]}</b></div>`}
      <div>${q.rationale}</div>
    </div>`;
  }

  bodyHtml += `
    <div class="qcontrols">
      <div class="nav-btns">
        <button class="btn" id="prevBtn" ${state.idx===0?'disabled':''} onclick="goPrev()">← Previous</button>
        <button class="btn" id="skipBtn" onclick="goNext()">Skip →</button>
      </div>
      <div class="nav-btns">
        ${!submitted ? `<button class="btn primary" id="checkBtn" onclick="handleCheck('${q.id}')">Check Answer</button>` : `<button class="btn gold" onclick="goNext()">Next Question →</button>`}
      </div>
    </div>
  `;

  panel.innerHTML = bodyHtml;
  renderMath(panel);

  if(q.type === 'grid' && !submitted){
    const input = document.getElementById('gridInput');
    input.addEventListener('input', ()=>{ state.gridValue = input.value; });
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleCheck(q.id); });
  }
}

function renderSummary(panel, filtered){
  const filteredIds = new Set(filtered.map(q=>q.id));
  const answeredIds = Object.keys(state.answered).filter(id=>filteredIds.has(id));
  const correctCount = answeredIds.filter(id=>state.answered[id].correct).length;

  const bySkill = {};
  filtered.forEach(q=>{
    if(!bySkill[q.skill]) bySkill[q.skill] = {total:0, answered:0, correct:0};
    bySkill[q.skill].total++;
    if(state.answered[q.id]){
      bySkill[q.skill].answered++;
      if(state.answered[q.id].correct) bySkill[q.skill].correct++;
    }
  });

  let rows = '';
  Object.keys(bySkill).forEach(s=>{
    const d = bySkill[s];
    let pillClass = 'mid', pillText = '—';
    if(d.answered>0){
      const pct = Math.round((d.correct/d.answered)*100);
      pillClass = pct>=80 ? 'good' : (pct>=50 ? 'mid' : 'bad');
      pillText = pct+'%';
    }
    rows += `<tr><td>${s}</td><td>${d.answered}/${d.total}</td><td>${d.correct}</td><td><span class="pill ${pillClass}">${pillText}</span></td></tr>`;
  });

  panel.innerHTML = `
    <div class="summary-state">
      <div class="big">Set complete — ${correctCount}/${answeredIds.length||0} correct</div>
      <p>You've gone through every question in the current filter. Review your breakdown below, or restart to try again.</p>
      <table class="summary-table">
        <tr><th>Skill</th><th>Answered</th><th>Correct</th><th>Accuracy</th></tr>
        ${rows}
      </table>
      <div style="margin-top:24px; display:flex; gap:10px; justify-content:center;">
        <button class="btn primary" onclick="restartSet(false)">Retry same set</button>
        <button class="btn gold" onclick="restartSet(true)">Shuffle &amp; retry</button>
      </div>
    </div>
  `;
}

function renderMath(container){
  if(window.renderMathInElement){
    renderMathInElement(container, {
      delimiters: [
        {left: "\\(", right: "\\)", display: false},
        {left: "\\[", right: "\\]", display: true}
      ],
      throwOnError: false
    });
  }
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function handleChoiceClick(qid, key){
  if(state.submitted[qid]) return;
  const q = byId(qid);
  q._chosen = key;
  document.querySelectorAll('.choice').forEach(el=>{
    el.classList.toggle('selected', el.dataset.key === key);
  });
}

function normalizeNumeric(str){
  if(str === undefined || str === null) return null;
  str = String(str).trim();
  if(str === '') return null;
  if(str.includes('/')){
    const parts = str.split('/');
    if(parts.length===2){
      const n = parseFloat(parts[0]), d = parseFloat(parts[1]);
      if(!isNaN(n) && !isNaN(d) && d!==0) return n/d;
    }
    return NaN;
  }
  const v = parseFloat(str);
  return isNaN(v) ? NaN : v;
}

function handleCheck(qid){
  const q = byId(qid);
  let chosen, correct;

  if(q.type === 'mcq'){
    chosen = q._chosen || null;
    if(!chosen){ return; }
    correct = (chosen === q.answer);
  } else {
    const input = document.getElementById('gridInput');
    chosen = input ? input.value.trim() : '';
    if(chosen === ''){ return; }
    const userVal = normalizeNumeric(chosen);
    correct = q.accept.some(a=>{
      const accVal = normalizeNumeric(a);
      if(isNaN(userVal) || isNaN(accVal)) return chosen === a;
      return Math.abs(userVal-accVal) < 0.02;
    });
  }

  state.answered[qid] = {chosen, correct};
  state.submitted[qid] = true;
  state.gridValue = '';
  renderMain();
  renderScore();
}

function goNext(){
  if(state.idx < state.order.length){
    state.idx++;
    state.gridValue = '';
    renderMain();
  }
}
function goPrev(){
  if(state.idx > 0){
    state.idx--;
    state.gridValue = '';
    renderMain();
  }
}
function goToMath(){
  state.primaryTab = 'math';
  renderAll();
}

function restartSet(shuffle){
  const filtered = getFilteredQuestions();
  state.order = shuffle ? shuffledIds(filtered) : filtered.map(q=>q.id);
  state.idx = 0;
  filtered.forEach(q=>{
    delete state.answered[q.id];
    delete state.submitted[q.id];
    q._chosen = null;
  });
  renderMain();
  renderScore();
}

document.getElementById('resetFiltersBtn').onclick = ()=>{
  const d = currentDomain();
  state.activeDifficulties = new Set(DIFFICULTIES);
  state.activeSkills = new Set(d.skills);
  d.questions.forEach(q=>{
    delete state.answered[q.id];
    delete state.submitted[q.id];
    q._chosen = null;
  });
  rebuildOrder(false);
  renderSidebar();
  renderMain();
};

/* =========================================================
   INIT
   ========================================================= */
function renderAll(){
  renderPrimaryTabs();
  renderDomainTabs();
  renderSidebar();
  renderMain();
}

state.activeSkills = new Set(currentDomain().skills);
rebuildOrder(false);
renderAll();
</script>
